services:
  compliment-bot:
    build: .
    image: compliment-bot:latest
    pull_policy: build
    container_name: compliment-bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ALLOWED_USERS: ${ALLOWED_USERS}
      ADMIN_ID: ${ADMIN_ID}
      ADMIN_SUMMARY_TIME: ${ADMIN_SUMMARY_TIME}
      GEMINI_MODELS: ${GEMINI_MODELS}
      GIRL_NAME: ${GIRL_NAME}
      SENDER_NAME: ${SENDER_NAME}
      GIRL_BIRTHDAY: ${GIRL_BIRTHDAY}
      TIMEZONE: ${TIMEZONE}
      TZ: ${TIMEZONE}
      DEFAULT_TIMES: ${DEFAULT_TIMES}
    volumes:
      - compliment-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  compliment-data:
