# Деплой через Portainer: Stacks → Add stack → Repository (URL git-репозитория, путь docker-compose.yml).
# Portainer сам соберёт образ по Dockerfile. Переменные задаются в «Environment variables» стека.
services:
  compliment-bot:
    build: .
    image: compliment-bot:latest
    pull_policy: build  # всегда собирать из репозитория, а не искать образ в Docker Hub
    container_name: compliment-bot
    restart: unless-stopped
    environment:
      # Все значения — только из env (Portainer: Stacks → Environment variables, локально — .env).
      # Описание переменных — в .env.example. Пустые необязательные берут значения по умолчанию из config.py
      BOT_TOKEN: ${BOT_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ALLOWED_USERS: ${ALLOWED_USERS}
      ADMIN_ID: ${ADMIN_ID}
      ADMIN_SUMMARY_TIME: ${ADMIN_SUMMARY_TIME}
      GEMINI_MODELS: ${GEMINI_MODELS}
      GIRL_NAME: ${GIRL_NAME}
      SENDER_NAME: ${SENDER_NAME}
      GIRL_BIRTHDAY: ${GIRL_BIRTHDAY}
      TIMEZONE: ${TIMEZONE}
      TZ: ${TIMEZONE}
      DEFAULT_TIMES: ${DEFAULT_TIMES}
    volumes:
      # Расписание, история (чтобы не было повторов) и счётчики
      - compliment-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  compliment-data:
